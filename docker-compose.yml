services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: mks_ps_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  location:
    image: micahkoleososoftware/mkspslocation:0.9.1-beta
    depends_on:
      database:
        condition: service_healthy
    environment:
      MKSPS_DATABASE_URL: mysql://root:my-secret-pw@database:3306/mks_ps_db
      MKSPS_LOCAL_IP: 127.0.0.1
      MKSPS_LOCAL_PORT: 11300
    ports:
      - "11300:11300/udp"

  controller:
    image: micahkoleososoftware/mkspscontroller:0.9.1-beta
    depends_on:
      database:
        condition: service_healthy
    environment:
      MKSPS_DATABASE_URL: mysql://root:my-secret-pw@database:3306/mks_ps_db
      MKSPS_LOCAL_IP: 127.0.0.1
      MKSPS_LOCAL_PORT: 11500
      MKSPS_LOCAL_REST_PORT: 11550
      MKSPS_REST_TIMEOUT_SECS: 30
    ports:
      - "11500:11500/udp"
      - "11550:11550"

  website:
    image: micahkoleososoftware/mkspswebsite:0.9.1-beta
    depends_on:
      controller:
        condition: service_started
    environment:
      MKSPS_CONTROLLER_BASE_URL: http://controller:11550/v1
    ports:
      - "8080:80"

volumes:
  mysql_data: